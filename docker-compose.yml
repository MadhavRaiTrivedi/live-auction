name: live-auction

x-auctions-connection: &auctions-connection
  ConnectionStrings__Auctions: Host=postgres;Port=5432;Database=${POSTGRES_DB:-live_auction};Username=${POSTGRES_USER:-auction};Password=${POSTGRES_PASSWORD:-auction};Maximum Pool Size=50;GSS Encryption Mode=Disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-live_auction}
      POSTGRES_USER: ${POSTGRES_USER:-auction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auction}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: src/LiveAuction.Infrastructure/Dockerfile.migrations
    environment:
      <<: *auctions-connection
    depends_on:
      postgres:
        condition: service_healthy

  # Several replicas on purpose: the Redis backplane and the SKIP LOCKED close job only prove
  # themselves with more than one instance. Reached only through the web container.
  api:
    build:
      context: .
      dockerfile: src/LiveAuction.Api/Dockerfile
    deploy:
      replicas: ${API_REPLICAS:-2}
    environment:
      <<: *auctions-connection
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-docker-signing-key-at-least-32-bytes}
      Jwt__EnableDevTokenEndpoint: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.1"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: frontend
    ports:
      - "8080:8080"
    depends_on:
      - api

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"

  k6:
    image: grafana/k6:2.3.0
    profiles: [load-test]
    environment:
      BASE_URL: http://web:8080
    volumes:
      - ./load-tests:/scripts:ro
    command: run /scripts/bidding.js
    depends_on:
      - web

volumes:
  postgres-data:
