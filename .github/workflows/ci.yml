name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Build and test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LiveAuction.slnx

      - name: Check formatting
        run: >
          dotnet format LiveAuction.slnx --verify-no-changes --no-restore
          --exclude src/LiveAuction.Infrastructure/Persistence/Migrations

      - name: Build
        run: dotnet build LiveAuction.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test --project tests/LiveAuction.UnitTests --no-build --configuration Release

      - name: Integration tests
        run: dotnet test --project tests/LiveAuction.IntegrationTests --no-build --configuration Release

  frontend:
    name: Build and test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build --configuration production

  images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build
