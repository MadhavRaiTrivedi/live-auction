# Serves the Angular app and load-balances the API. With `docker compose up --scale api=N`,
# Docker's DNS returns every replica for "api"; `resolve` keeps the list current.
resolver 127.0.0.11 valid=10s;

upstream api {
    zone api 64k;
    server api:8080 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The hub uses WebSockets only, so a connection stays on the instance it first reached
    # and no sticky sessions are needed.
    location /hubs/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
